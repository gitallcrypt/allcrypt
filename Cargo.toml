[dependencies]
#serialize = "1.0"
lazy_static = "1.0"
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[features]
# Off by default: `cargo test` stays free of the pyo3 dependency.
# Build the module with `python3 scripts/build_python.py`, which is
# cargo plus a rename. maturin builds wheels from the same feature.
python = ["dep:pyo3"]
# Hardware AES (AES-NI) and GHASH (PCLMULQDQ) on x86-64, chosen at run
# time when the processor has them. Off by default because reaching the
# instructions needs `unsafe`, which nothing else in the library's
# cryptography uses; src/block_ciphers/aes_ni.rs and docs/building.md
# ("Building for speed") say what it buys - speed, and constant time for
# the one-block-at-a-time modes - and what the `unsafe` is. Does nothing
# on other architectures.
aes-ni = []
# SHA-1 and SHA-256 on the x86-64 SHA extensions, chosen at run time
# when the processor has them. Off by default for the same reason as
# `aes-ni`: the instructions need `unsafe`. src/hash_functions/sha_ni.rs
# says what the `unsafe` is. Does nothing on other architectures.
sha-ni = []
# ChaCha20 (and XChaCha20, and ChaCha20-Poly1305's keystream) on vector
# registers: SSE2 on every x86-64 processor, AVX2 chosen at run time
# where the processor has it. Off by default for the same reason again:
# src/stream_ciphers/chacha_simd.rs says what the `unsafe` is. Does
# nothing on other architectures.
simd = []
# The C interface: `extern "C"` functions over `api`, declared in
# include/allcrypt.h. Off by default because the functions are exported
# from every build that has them, and only a C caller wants that.
# docs/c.md has the build and link lines; scripts/check_c_api.py checks
# the header against the library and runs a C program through it.
c-api = []
