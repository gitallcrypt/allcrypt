# One workspace, three packages: the library (and its proxy binary)
# here, the OpenSSL shim in shim/, and the development tools in tools/.
# The shim has to be its own package because a package produces one
# library, and the shim's is a `cdylib` that must be called `libssl.so`
# rather than `liballcrypt.so`. The tools are their own package so that
# examples/ holds only examples, and so that every program in
# tools/src/bin/ is found without a line here.
[workspace]
members = [".", "shim", "tools"]
# All three, so a plain `cargo build` produces the shim as well as the
# library and the proxy - `pytests/test_shim.py` runs the real
# `libssl.so`, and a gate command that does not build it turns that
# whole file into a failure about a missing file - and so that `cargo
# test` and clippy compile the tools.
default-members = [".", "shim", "tools"]

[package]
name = "allcrypt"
version = "0.1.0"
edition = "2021"
license = "0BSD"
description = "Common and uncommon cryptographic algorithms in pure Rust, old and broken ones included, with Python and C bindings."
repository = "https://github.com/gitallcrypt/allcrypt"
readme = "README.md"
# The oldest toolchain this builds on. Declared rather than implied:
# `is_multiple_of` and `Option::is_none_or` were stabilised in 1.87 and
# are now used throughout, so an older compiler fails with a handful of
# unrelated-looking method-not-found errors instead of one clear line.
# Raise it only for a reason worth writing in the commit message - this
# library exists to talk to old things, and being buildable on an old
# toolchain is part of that.
rust-version = "1.87"

[lib]
name = "allcrypt"
crate-type = ["cdylib", "rlib"]

# The proxy. Named for what it is rather than after the crate: it is a
# tool somebody runs, not the library, and `allcrypt` on a PATH would
# say nothing about what it does.
[[bin]]
name = "allcrypt-proxy"
path = "src/main.rs"


# The product examples: formats other software writes, built from the
# library's primitives, each with tests that `cargo test` runs.
# `examples/products/README.md` lists them and what checked each.
